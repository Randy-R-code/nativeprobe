name: Bug report
description: Something in NativeProbe doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. Which probe is affected?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the ... probe
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. iPhone 15 Pro, iOS 18.1 — physical device
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Running in
      options:
        - Expo Go
        - Development build
        - Simulator/Emulator
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NativeProbe version / commit
    validations:
      required: false
